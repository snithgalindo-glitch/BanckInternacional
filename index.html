<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BancoloInternacional - Acceso</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>

  <!-- =========================
       PANTALLA DE LOGIN
  ========================== -->
  <main id="login-view" class="view-container">

    <div class="logo-container">
      <svg class="logo-icon"
           viewBox="0 0 24 24"
           fill="none"
           stroke="currentColor"
           stroke-width="2">
        <circle cx="12" cy="12" r="10"></circle>
        <path d="M2 12h20"></path>
        <path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10"></path>
        <path d="M12 2a15.3 15.3 0 0 0-4 10 15.3 15.3 0 0 0 4 10"></path>
      </svg>

      <span class="logo-text">
        <strong>Bancolo</strong>Internacional
      </span>
    </div>

    <form id="access-form" class="login-form">

      <div class="input-group">
        <label for="username">NOMBRE DE USUARIO</label>
        <input
          type="text"
          id="username"
          placeholder="Ingresa tu usuario"
          autocomplete="off"
          required
        >
      </div>

      <div class="input-group">
        <label for="password">CONTRASEÑA</label>
        <input
          type="password"
          id="password"
          placeholder="••••••••"
          required
        >
      </div>

      <div class="forgot-password">
        <a href="#" id="forgot-link">¿Olvidaste tu contraseña?</a>
      </div>

      <button type="submit" class="btn-submit">
        INGRESAR
      </button>

    </form>

    <div class="contact-section">
      <span>📞</span>
      <span>• Contactanos •</span>
      <span>📞</span>
    </div>

    <footer class="footer-text">
      © Sistema seguro de acceso para usuarios registrados de
      BancoloInternacional. 🔒
    </footer>

  </main>


  <!-- =========================
       PANTALLA PRINCIPAL
  ========================== -->
  <main id="dashboard-view" class="dashboard-view hidden">

    <header class="dashboard-header">

      <div>
        <span class="welcome-text">Bienvenido</span>
        <h2 id="user-display">Usuario</h2>
      </div>

      <div class="user-avatar" id="user-avatar">
        U
      </div>

    </header>


    <section class="balance-card">

      <span class="balance-label">
        Saldo Principal
      </span>

      <h1 class="balance-amount">
        $ 4.787.000
      </h1>

      <span class="balance-status">
        Cuenta activa
      </span>

    </section>


    <section class="action-grid">

      <button class="action-card">
        <span class="action-icon">💰</span>
        <span>Consultar</span>
      </button>

      <button class="action-card">
        <span class="action-icon">↗️</span>
        <span>Transferir</span>
      </button>

      <button class="action-card">
        <span class="action-icon">📋</span>
        <span>Movimientos</span>
      </button>

    </section>


    <button id="logout-btn" class="logout-btn">
      CERRAR SESIÓN
    </button>

  </main>

 
  <script src="script.js"></script>

</body>
</html>
